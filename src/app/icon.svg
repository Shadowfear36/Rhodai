<svg width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="40" height="40" rx="8" fill="#050508"/>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Hexagon border -->
  <polygon points="20,3 34,11.5 34,28.5 20,37 6,28.5 6,11.5" fill="none" stroke="url(#g)" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Grid lines -->
  <line x1="20" y1="5" x2="20" y2="20" stroke="url(#g)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="32" y1="13" x2="20" y2="20" stroke="url(#g)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="8" y1="27" x2="20" y2="20" stroke="url(#g)" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Center node -->
  <circle cx="20" cy="20" r="2.5" fill="url(#g)"/>
  <!-- Outer nodes -->
  <circle cx="20" cy="5" r="1.8" fill="#06b6d4"/>
  <circle cx="32" cy="13" r="1.8" fill="#8b5cf6"/>
  <circle cx="8" cy="27" r="1.8" fill="#06b6d4"/>
</svg>
